<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lattice（仮）｜サイトを組み立てる</title>
<meta name="theme-color" content="#FFFFFF">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--bg:#E9ECEF;--pn:#FFFFFF;--ink:#14171C;--ink2:#5B6370;--line:#D5DAE0;--ac:#2F45E8;--aci:#FFFFFF;--acs:#DDE2FF;--danger:#C2302A;--f:'Bricolage Grotesque','Zen Kaku Gothic New',system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121418;--pn:#1B1F25;--ink:#ECEEF1;--ink2:#9AA3AE;--line:#2D333B;--ac:#7383FF;--aci:#0D1020;--acs:#2A3266;--danger:#FF7B72;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121418;--pn:#1B1F25;--ink:#ECEEF1;--ink2:#9AA3AE;--line:#2D333B;--ac:#7383FF;--aci:#0D1020;--acs:#2A3266;--danger:#FF7B72;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
[hidden]{display:none!important}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--pn);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:6px;min-width:0;flex:1}
.mark{width:26px;height:26px;flex:none;color:var(--ac)}
#siteName{min-width:0;flex:1;border:0;background:transparent;font-weight:700;font-size:16px;padding:6px;border-radius:8px;text-overflow:ellipsis}
#siteName:focus{background:var(--bg);outline:none}
.ibtn{display:grid;place-items:center;width:36px;height:36px;border:1px solid var(--line);border-radius:10px;background:var(--pn);flex:none}.ibtn svg{width:18px;height:18px}.ibtn:disabled{opacity:.35}
#pageSel{max-width:30vw;padding:7px 8px;border:1px solid var(--line);border-radius:10px;background:var(--pn);font-size:13px}
.seg{display:inline-flex;padding:3px;border-radius:10px;background:var(--bg);border:1px solid var(--line);flex:none}
.seg button{border:0;background:transparent;padding:5px 10px;border-radius:7px;font-size:13px;font-weight:500;color:var(--ink2)}
.seg button.on{background:var(--pn);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.stage{padding:12px 12px 0}
.frame{position:relative;height:56vh;min-height:320px;border-radius:14px;overflow:hidden;background:var(--pn);border:1px solid var(--line)}
.frame.framed{background:repeating-linear-gradient(45deg,var(--bg) 0 8px,var(--pn) 8px 16px)}
#pv{position:absolute;top:0;left:0;border:0;transform-origin:0 0;background:#fff}
.hint{margin:8px 4px 0;font-size:12px;color:var(--ink2)}
.panel{padding:12px 12px 40px}
.tabs{display:flex;gap:2px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:10px 12px;font-weight:700;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--ink)}
@media (min-width:980px){
  body{height:100vh;overflow:hidden}
  .main{display:grid;grid-template-columns:400px 1fr;height:calc(100vh - 57px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
  .panel{order:-1;overflow:auto;border-right:1px solid var(--line);background:var(--pn);padding:16px 18px 40px}
  .stage{padding:18px;display:flex;flex-direction:column;min-height:0}.frame{flex:1;height:auto}
}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--pn);padding:6px 12px;border-radius:99px;font-size:13px;line-height:1.4}
.chip.on{background:var(--ink);color:var(--pn);border-color:var(--ink)}
.pages{display:flex;gap:8px;align-items:flex-start;margin-bottom:16px}.pages .chips{flex:1}
.row-h{display:flex;justify-content:space-between;align-items:center;margin:0 0 8px}.row-h h3{margin:0;font-size:13px;color:var(--ink2);font-weight:500}
.tbtn{border:0;background:none;color:var(--ac);font-weight:700;font-size:13px;padding:6px 2px;flex:none}
.stack{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.stack li{display:flex;align-items:stretch;background:var(--pn);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stack li.sel{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}
.stack li.empty{padding:16px;color:var(--ink2);font-size:13px;border-style:dashed}
.sk-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;border:0;background:none;text-align:left;padding:10px 4px 10px 10px}
.gl{flex:none;width:44px;height:30px;border-radius:7px;background:var(--bg);display:grid;place-items:center;color:var(--ink)}.gl svg{width:30px;height:20px}
.sk-t{min-width:0}.sk-t b{display:block;font-size:14px;line-height:1.3}.sk-t small{display:block;color:var(--ink2);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sk-act{display:flex;align-items:center;padding-right:2px}
.sk-act button{width:30px;height:34px;border:0;background:none;border-radius:8px;display:grid;place-items:center;color:var(--ink2)}.sk-act svg{width:16px;height:16px}.sk-act button:disabled{opacity:.25}
.add{width:100%;margin-top:10px;padding:14px;border:1.5px dashed var(--line);border-radius:12px;background:transparent;font-weight:700;color:var(--ink2)}.add.sm{padding:10px;margin-top:2px;font-size:13px}
.pri{display:block;width:100%;padding:15px;border:0;border-radius:12px;background:var(--ac);color:var(--aci);font-weight:700;font-size:15px;margin-bottom:10px}.pri:disabled{opacity:.5}
.sec{display:block;width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;background:var(--pn);font-weight:700;margin-bottom:10px;text-align:center}.sec:disabled{opacity:.4}
.as-btn{cursor:pointer}.danger{color:var(--danger)}
.btn-row{display:flex;gap:8px}.btn-row .sec{flex:1}
.note{font-size:13px;color:var(--ink2);margin:0 0 14px}.sub-h{margin:26px 0 8px;font-size:13px}
.fld{display:grid;gap:6px;margin-bottom:14px}.fld>span{font-size:12px;font-weight:700;color:var(--ink2)}
.fld input[type=text],.fld textarea,.fld select,.inp{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:16px;line-height:1.5}
.fld textarea{resize:vertical;min-height:76px}
.fld.chk{display:flex;align-items:center;gap:8px}.fld.chk span{color:var(--ink);font-weight:500;font-size:14px}.fld.chk input{width:20px;height:20px;accent-color:var(--ac)}
.list-it{border:1px solid var(--line);border-radius:12px;padding:10px 12px 0;margin-bottom:8px;background:var(--pn)}
.list-h{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--ink2);font-weight:700;margin-bottom:4px}
.img-f{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.img-f .th{width:64px;height:48px;border-radius:8px;background:var(--bg) center/cover;border:1px solid var(--line);flex:none}
.img-f .th.none{background-image:linear-gradient(135deg,transparent 47%,var(--line) 47% 53%,transparent 53%)}
.sbtn{display:inline-flex;align-items:center;padding:8px 12px;border:1px solid var(--line);border-radius:9px;background:var(--pn);font-size:13px;font-weight:700;cursor:pointer}
.sheet-bg{position:fixed;inset:0;z-index:50;background:rgba(10,12,16,.18);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:60vh;box-shadow:0 -10px 40px rgba(0,0,0,.18);background:var(--pn);border-radius:18px 18px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(28px);opacity:.5}}
@media (min-width:980px){.sheet-bg{align-items:center;background:rgba(10,12,16,.35)}.sheet{border-radius:18px;max-height:84vh}}
@media (max-width:600px){#pageSel{display:none}}
.sh-h{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}.sh-h h2{margin:0;font-size:16px}
.sh-h button{border:0;background:var(--ink);color:var(--pn);padding:7px 14px;border-radius:9px;font-weight:700;font-size:13px}
.sh-b{overflow:auto;padding:16px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sh-sec{margin-bottom:16px}.sh-sec>h4,.grp>h4{margin:0 0 8px;font-size:12px;color:var(--ink2)}.grp{margin-bottom:24px}
.ai-box{border:1px solid var(--acs);background:color-mix(in srgb,var(--acs) 40%,var(--pn));border-radius:12px;padding:12px;margin:0 0 18px}
.ai-box p{margin:0 0 8px;font-size:13px;font-weight:700;color:var(--ac)}
.ai-row{display:flex;gap:8px}.ai-row .inp{flex:1;min-width:0;background:var(--pn)}
.ai-row button{flex:none;padding:0 16px;border:0;border-radius:10px;background:var(--ac);color:var(--aci);font-weight:700}.ai-row button:disabled{opacity:.5}
.ai-st{display:block;font-size:12px;color:var(--ink2);margin-top:6px}.ai-st:empty{display:none}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.lib button{display:flex;gap:10px;align-items:center;text-align:left;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--pn)}.lib b{display:block;font-size:14px}.lib small{display:block;color:var(--ink2);font-size:11.5px;line-height:1.4}
.pals{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.pal{border:1px solid var(--line);border-radius:12px;background:var(--pn);padding:7px;text-align:left;font-size:12px}.pal.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.pal .sw{display:flex;height:30px;border-radius:7px;overflow:hidden;margin-bottom:6px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}.pal .sw i{flex:1}.pal .sw i:first-child{flex:2}
.cols{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.cols label{display:grid;gap:4px;font-size:10.5px;color:var(--ink2);text-align:center}.cols input{width:100%;height:38px;border:1px solid var(--line);border-radius:9px;padding:2px;background:var(--pn)}
.fonts{display:grid;gap:6px}.fp{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;background:var(--pn);padding:10px 12px;text-align:left}.fp.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}.fp b{font-size:20px;line-height:1.3}.fp small{color:var(--ink2);font-size:12px;flex:none}
.range{display:flex;align-items:center;gap:12px}.range input{flex:1;accent-color:var(--ac)}.range span{font-size:13px;color:var(--ink2);width:3em;text-align:right}
.start{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 32px) 20px calc(env(safe-area-inset-bottom,0px) + 48px)}
.start-in{max-width:520px;margin:0 auto}
.stack-art{display:flex;flex-direction:column;gap:4px;width:78px}
.stack-art span{display:grid;place-items:center;height:24px;border-radius:7px;background:var(--pn);border:1px solid var(--line);color:var(--ink);opacity:0;transform:translateY(-10px);animation:drop .5s cubic-bezier(.2,.9,.3,1.2) forwards}.stack-art span svg{width:24px;height:16px}
.stack-art span:nth-child(1){animation-delay:.05s;color:var(--ac)}.stack-art span:nth-child(2){animation-delay:.2s;width:86%}.stack-art span:nth-child(3){animation-delay:.35s}.stack-art span:nth-child(4){animation-delay:.5s;width:70%}
@keyframes drop{to{opacity:1;transform:none}}
.start h1{font-size:clamp(28px,7.5vw,42px);line-height:1.15;letter-spacing:-.02em;margin:22px 0 10px;font-weight:800}
.start .sub{color:var(--ink2);margin:0 0 26px}
.start label,.start fieldset{display:grid;gap:6px;margin:0 0 16px;font-size:13px;font-weight:700;border:0;padding:0}
.start legend{padding:0;margin-bottom:8px}
.start input,.start textarea{padding:13px;border:1px solid var(--line);border-radius:12px;background:var(--pn);font-size:16px;font-weight:400;width:100%}
.alt{display:flex;gap:8px;margin-top:4px}.alt button{flex:1;padding:12px;border:1px solid var(--line);border-radius:12px;background:transparent;font-weight:700}
.ai-off{font-size:13px;color:var(--ink2);margin:0 0 12px;padding:12px;border-radius:12px;background:var(--pn);border:1px solid var(--line)}
#sCancel{margin-top:14px;border:0;background:none;color:var(--ink2);font-weight:700;padding:8px 0}
#prog h2{font-size:24px;margin:22px 0 6px}#prog ol{list-style:none;padding:0;margin:20px 0;display:grid;gap:8px}
#prog li{display:flex;gap:12px;align-items:center;padding:13px 14px;border-radius:12px;background:var(--pn);border:1px solid var(--line);font-size:14px}
#prog li i{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none}
#prog li.run i{border-color:var(--ac);border-top-color:transparent;animation:spin .8s linear infinite}
#prog li.done i{background:var(--ac);border-color:var(--ac)}#prog li.err i{background:var(--danger);border-color:var(--danger)}
#progMsg{color:var(--danger);font-size:14px}#progMsg:empty{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--ink);color:var(--pn);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:90vw;text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.stack-art span{opacity:1;transform:none}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <svg class="mark" viewBox="0 0 26 26" aria-hidden="true"><rect x="3" y="3" width="20" height="5" rx="1.5" fill="currentColor"/><rect x="3" y="10.5" width="13" height="5" rx="1.5" fill="currentColor" opacity=".55"/><rect x="3" y="18" width="20" height="5" rx="1.5" fill="currentColor" opacity=".3"/></svg>
    <input id="siteName" aria-label="サイト名" autocomplete="off">
  </div>
  <button class="ibtn" id="undo" aria-label="元に戻す" disabled><svg viewBox="0 0 18 18"><path d="M6 4 2.5 7.5 6 11M3 7.5h7.5a4.5 4.5 0 0 1 0 9H8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <select id="pageSel" aria-label="表示するページ"></select>
  <div class="seg" id="viewSeg"><button data-v="m" class="on">スマホ</button><button data-v="d">PC</button></div>
</header>
<div class="main">
  <section class="stage"><div class="frame" id="frameWrap"><iframe id="pv" title="サイトのプレビュー"></iframe></div><p class="hint">プレビューのブロックをタップすると、その場で編集できます。</p></section>
  <aside class="panel">
    <nav class="tabs"><button data-t="build" class="on">構成</button><button data-t="design">デザイン</button><button data-t="export">保存・公開</button></nav>
    <div class="tab" id="t-build">
      <div class="pages"><div class="chips" id="pageChips"></div><button class="tbtn" id="addPage">＋ページ</button></div>
      <div class="row-h"><h3 id="pageTitleH"></h3><button class="tbtn" id="pageSet">ページ設定</button></div>
      <ol class="stack" id="stack"></ol>
      <button class="add" id="addBlock">＋ ブロックを追加</button>
    </div>
    <div class="tab" id="t-design" hidden></div>
    <div class="tab" id="t-export" hidden></div>
  </aside>
</div>

<div class="start" id="start" hidden>
  <div class="start-in">
    <div id="startForm">
      <div class="stack-art" aria-hidden="true"><span><svg viewBox="0 0 28 19" fill="currentColor"><rect x="2" y="3" width="11" height="3" rx="1"/><rect x="2" y="8" width="8" height="2" rx="1" opacity=".45"/><rect x="2" y="12" width="5" height="3" rx="1"/><rect x="15" y="2" width="11" height="15" rx="1.5" opacity=".3"/></svg></span><span><svg viewBox="0 0 28 19" fill="currentColor"><rect x="2" y="3" width="7" height="2" rx="1"/><rect x="11" y="3" width="7" height="2" rx="1"/><rect x="20" y="3" width="6" height="2" rx="1"/><rect x="2" y="7" width="7" height="8" rx="1" opacity=".3"/><rect x="11" y="7" width="7" height="8" rx="1" opacity=".3"/><rect x="20" y="7" width="6" height="8" rx="1" opacity=".3"/></svg></span><span><svg viewBox="0 0 28 19" fill="currentColor"><rect x="2" y="2" width="7" height="7" rx="1" opacity=".35"/><rect x="11" y="2" width="7" height="7" rx="1" opacity=".55"/><rect x="20" y="2" width="6" height="7" rx="1" opacity=".35"/><rect x="2" y="11" width="7" height="6" rx="1" opacity=".55"/><rect x="11" y="11" width="7" height="6" rx="1" opacity=".35"/><rect x="20" y="11" width="6" height="6" rx="1" opacity=".55"/></svg></span><span><svg viewBox="0 0 28 19" fill="currentColor"><rect x="2" y="3" width="24" height="13" rx="2" opacity=".3"/><rect x="7" y="6" width="14" height="2" rx="1"/><rect x="10" y="11" width="8" height="3" rx="1.5"/></svg></span></div>
      <h1>どんなサイトを<br>作りますか</h1>
      <p class="sub">質問は4つだけ。ページの構成、デザイン、文章までAIが組み立てます。できあがったら、タップするだけで自由に直せます。</p>
      <label>名前<input id="sName" placeholder="例：みなと整骨院／山田建築設計／NPOひだまり" autocomplete="off"></label>
      <label>どんなお店・会社・団体・人？<input id="sKind" placeholder="例：整骨院、建築事務所、子ども食堂、写真家" autocomplete="off"></label>
      <label>サイトで伝えたいこと・やりたいこと<textarea id="sDesc" rows="3" placeholder="例：初めての人に安心してもらいたい。料金、予約の方法、院長の想いを載せたい"></textarea></label>
      <fieldset><legend>雰囲気（いくつでも）</legend><div class="chips" id="sVibe"></div></fieldset>
      <p class="ai-off" id="aiOff" hidden>AIでの自動作成は、Claudeアプリの中でこのページを開いたときに使えます。サンプルや白紙から始めて、手で編集することもできます。</p>
      <button class="pri" id="sGo" hidden>AIでサイトを組み立てる</button>
      <div class="alt"><button id="sDemo">サンプルを開く</button><button id="sBlank">白紙から作る</button></div>
      <button id="sCancel" hidden>編集中のサイトに戻る</button>
    </div>
    <div id="prog" hidden>
      <h2>サイトを組み立てています</h2>
      <p class="note">ページごとに文章を書くので、1〜3分ほどかかります。</p>
      <ol id="progList"></ol>
      <p id="progMsg"></p>
      <button class="sec" id="progBack" hidden>入力に戻る</button>
      <button class="sec" id="progStop">中止する</button>
    </div>
  </div>
</div>

<div class="sheet-bg" id="sheetBg" hidden><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle"><div class="sh-h"><h2 id="shTitle"></h2><button id="shClose">完了</button></div><div class="sh-b" id="shBody"></div></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
/* ===== Lattice core: data model, block library, renderer (no DOM) ===== */
var uid = function(){ return Math.random().toString(36).slice(2,9); };
var esc = function(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); };
var nl = function(s){ return esc(s).replace(/\n/g,'<br>'); };
var rep = function(n,o){ var a=[]; for(var i=0;i<n;i++) a.push(JSON.parse(JSON.stringify(o))); return a; };

/* ---- color helpers ---- */
var hexOk = function(h){ return typeof h==='string' && /^#[0-9a-fA-F]{6}$/.test(h); };
var lum = function(h){ var c=[1,3,5].map(function(i){ var v=parseInt(h.substr(i,2),16)/255; return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4); }); return .2126*c[0]+.7152*c[1]+.0722*c[2]; };
var contrast = function(a,b){ var x=lum(a), y=lum(b); return (Math.max(x,y)+.05)/(Math.min(x,y)+.05); };
var onColor = function(h){ return contrast(h,'#FFFFFF')>=contrast(h,'#111111')?'#FFFFFF':'#111111'; };

/* ---- sanitizing ---- */
function cleanTheme(t){
  t = t||{}; var p = t.pal||t.palette||{}; var base = PALS[0], pal={};
  ['bg','surface','text','muted','accent'].forEach(function(k){ pal[k]=hexOk(p[k])?p[k].toUpperCase():base[k]; });
  if(contrast(pal.text,pal.bg)<4.5) pal.text = onColor(pal.bg)==='#FFFFFF'?'#F4F4F2':'#141414';
  if(contrast(pal.muted,pal.bg)<3) pal.muted = pal.text;
  var r=[0,6,16,28], rad=Number(t.radius); if(isNaN(rad)) rad=6;
  rad = r.reduce(function(a,b){ return Math.abs(b-rad)<Math.abs(a-rad)?b:a; });
  var sc = Number(t.scale); if(isNaN(sc)) sc=1; sc=Math.min(1.3,Math.max(.85,sc));
  return {pal:pal,fontId:FONTS[t.fontId]?t.fontId:'modern',radius:rad,scale:Math.round(sc*100)/100,sep:t.sep==='line'?'line':'none'};
}
function cleanVal(f,v,dv){
  if(f.t==='list'){
    if(!Array.isArray(v)) return JSON.parse(JSON.stringify(dv||[]));
    return v.slice(0,16).map(function(it){ var o={}; it=it&&typeof it==='object'?it:{}; f.f.forEach(function(sf){ o[sf.k]=cleanVal(sf,it[sf.k],f.d[sf.k]); }); return o; });

  if(f.t==='image') return (typeof v==='string' && /^(data:image\/|https:\/\/)/.test(v))?v:'';
  if(v==null) return dv==null?'':dv;
  return String(v).slice(0,4000);
}

function slugify(s,i){ var x=String(s||'').toLowerCase().replace(/[^a-z0-9-]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40); return x||('page'+(i+1)); }

}
function cleanSite(s){

  var pals=h('<div class="pals"></div>');
  PALS.forEach(function(p){ var on=['bg','surface','text','muted','accent'].every(function(k){return th.pal[k]===p[k].toUpperCase();});
    var b=h('<button class="pal'+(on?' on':'')+'" type="button"><span class="sw"><i style="background:'+p.bg+'"></i><i style="background:'+p.surface+'"></i><i style="background:'+p.text+'"></i><i style="background:'+p.accent+'"></i></span><span>'+esc(p.n)+'</span></button>');
    b.onclick=function(){ mutate(function(){ S.theme=cleanTheme({pal:p,fontId:th.fontId,radius:th.radius,scale:th.scale,sep:th.sep}); }); renderDesign(); }; pals.appendChild(b); });
  box.appendChild(grp('配色',pals));
  var cols=h('<div class="cols"></div>'), names={bg:'背景',surface:'面',text:'文字',muted:'補助文字',accent:'アクセント'};
  Object.keys(names).forEach(function(k){ var c=h('<label><input type="color" value="'+th.pal[k]+'">'+names[k]+'</label>'); c.querySelector('input').oninput=function(e){ var v=e.target.value.toUpperCase(); mutate(function(){ S.theme.pal[k]=v; },'col'+k,true); }; c.querySelector('input').onchange=function(){ renderDesign(); }; cols.appendChild(c); });
  box.appendChild(grp('色を細かく調整',cols));
  var fl=h('<div class="fonts"></div>');
  Object.keys(FONTS).forEach(function(k){ var f=FONTS[k]; var b=h('<button class="fp'+(th.fontId===k?' on':'')+'" type="button"><b style="font-family:'+f.d.replace(/"/g,'')+';font-weight:'+f.hw+'">サイトの文字 Aa</b><small>'+esc(f.n)+'</small></button>');
    b.onclick=function(){ mutate(function(){ S.theme.fontId=k; }); renderDesign(); }; fl.appendChild(b); });
  box.appendChild(grp('文字の組み合わせ',fl));
  box.appendChild(grp('角の丸み',chipRow({'0':'なし','6':'少し','16':'丸い','28':'とても丸い'},String(th.radius),function(v){ mutate(function(){ S.theme.radius=Number(v); }); })));
  var rg=h('<div class="range"><input type="range" min="0.85" max="1.3" step="0.05" value="'+th.scale+'"><span>'+Math.round(th.scale*100)+'%</span></div>');
  rg.querySelector('input').oninput=function(e){ var v=Number(e.target.value); rg.querySelector('span').textContent=Math.round(v*100)+'%'; mutate(function(){ S.theme.scale=v; },'scale',true); };
  box.appendChild(grp('見出しの大きさ',rg));
  box.appendChild(grp('ブロックの区切り',chipRow({none:'なし',line:'線を引く'},th.sep,function(v){ mutate(function(){ S.theme.sep=v; }); })));
  box.appendChild(grp('メニューの形',chipRow(NAVS,S.nav,function(v){ mutate(function(){S.nav=v;}); })));
  box.appendChild(grp('フッターの形',chipRow(FOOTS,S.footer.v,function(v){ mutate(function(){S.footer.v=v;}); })));
}
function grp(title,node){ var g=h('<div class="grp"><h4>'+esc(title)+'</h4></div>'); g.appendChild(node); return g; }

/* ---- export tab ---- */
var DL=null;
function safeName(){ return (S.name||'site').replace(/[\\\/:*?"<>|\s]+/g,'-').slice(0,40)||'site'; }
async function saveFile(name,data){ if(!DL){ try{ var bl=data instanceof Blob?data:new Blob([data],{type:'application/octet-stream'}), u=URL.createObjectURL(bl), a=document.createElement('a'); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){URL.revokeObjectURL(u);},4000); toast('保存しました'); }catch(e){ toast('保存できませんでした'); } return; } try{ await DL.save({filename:name,data:data}); toast('保存しました'); }catch(e){ if(e&&e.code!=='declined') toast('保存できませんでした（'+(e&&e.code)+'）'); } }
async function exportZip(){
  if(typeof JSZip==='undefined'){ toast('ZIPの準備ができていません。少し待ってからもう一度どうぞ'); return; }
  var z=new JSZip(); S.pages.forEach(function(p){ z.file(fileOf(S,p),docHTML(S,p,'export','style.css')); }); z.file('style.css',siteCSS(S.theme));
  var blob=await z.generateAsync({type:'blob'}); await saveFile(safeName()+'.zip',blob);
}
function renderExport(){
  var box=$('#t-export'); box.innerHTML='';
  box.appendChild(h('<p class="note">作ったサイトは、全ページ入りのファイルとして保存できます。中身をGitHub Pagesなどのサーバーに置けば、そのまま公開できます。</p>'));
  var z=h('<button class="pri" type="button">サイト一式を保存（ZIP）</button>'); z.onclick=exportZip; box.appendChild(z);
  var one=h('<button class="sec" type="button">表示中のページだけ保存（HTML）</button>'); one.onclick=function(){ var p=curPage(); saveFile(safeName()+'-'+p.slug+'.html',docHTML(S,p,'export')); }; box.appendChild(one);
  box.appendChild(h('<h4 class="sub-h">編集データ</h4>'));
  box.appendChild(h('<p class="note">編集中のデータはこの端末に自動で保存されています。別の端末で続けたいときや、念のための控えに使ってください。</p>'));
  var bk=h('<button class="sec" type="button">編集データを保存（JSON）</button>'); bk.onclick=function(){ saveFile(safeName()+'-data.json',JSON.stringify(S)); }; box.appendChild(bk);
  var im=h('<label class="sec as-btn">編集データを読み込む<input type="file" accept="application/json,.json" hidden></label>');
  im.querySelector('input').onchange=function(e){ var f=e.target.files[0]; if(!f) return; var r=new FileReader(); r.onload=function(){ try{ var d=cleanSite(JSON.parse(r.result)); mutate(function(){ S=d; }); curPid=S.pages[0].id; renderAll(); toast('読み込みました'); }catch(err){ toast('このファイルは読み込めませんでした'); } }; r.readAsText(f); };
  box.appendChild(im);
  box.appendChild(h('<h4 class="sub-h">新しく作る</h4>'));
  var nw=h('<button class="sec" type="button">別のサイトを作る</button>'); nw.onclick=function(){ showStart(true); }; box.appendChild(nw);
}

/* ---- start / AI build ---- */
var VIBES=['上品','親しみやすい','力強い','ナチュラル','先進的','和風','遊び心','信頼感','高級感','ミニマル','温かい','クール'], vibeSel=[], buildCtl=null;
function showStart(canCancel){
  $('#start').hidden=false; $('#startForm').hidden=false; $('#prog').hidden=true; $('#sCancel').hidden=!canCancel;
  var vb=$('#sVibe'); vb.innerHTML=''; vibeSel=[];
  VIBES.forEach(function(v){ var c=h('<button class="chip" type="button">'+v+'</button>'); c.onclick=function(){ var i=vibeSel.indexOf(v); if(i>=0) vibeSel.splice(i,1); else vibeSel.push(v); c.classList.toggle('on'); }; vb.appendChild(c); });
  $('#aiOff').hidden=!!SAMPLE; $('#sGo').hidden=!SAMPLE;
}
function hideStart(){ $('#start').hidden=true; }
function adopt(site){ hist.push(S?JSON.stringify(S):JSON.stringify(site)); if(!S) hist=[]; S=site; curPid=S.pages[0].id; selId=null; save(); renderAll(); hideStart(); $('#undo').disabled=!hist.length; }
async function startAI(){
  var inp={name:$('#sName').value.trim(),kind:$('#sKind').value.trim(),desc:$('#sDesc').value.trim(),vibe:vibeSel.slice()};
  if(!inp.name||!inp.kind){ toast('名前と種類を入力してください'); return; }
  $('#startForm').hidden=true; $('#prog').hidden=false;
  var list=$('#progList'); list.innerHTML=''; list.appendChild(h('<li data-k="plan"><i></i><span>サイトの設計図をつくる（ページ構成とデザイン）</span></li>'));
  buildCtl=new AbortController();
  try{
    var res=await aiBuildSite(inp,function(k,st,site){
      if(site){ site.pages.forEach(function(p){ list.appendChild(h('<li data-k="'+p.id+'"><i></i><span>「'+esc(p.title)+'」の文章を書く</span></li>')); }); }
      var li=list.querySelector('[data-k="'+k+'"]'); if(li) li.className=st;
    },buildCtl.signal);
    adopt(res.site); toast(res.errors?'一部のページは仮の文章のままです。ブロックからAIで書き直せます':'できました。タップして自由に直せます');
  }catch(e){
    if(e&&e.code==='cancelled'){ showStart(!!S); return; }
    $('#progMsg').textContent=aiErr(e); $('#progBack').hidden=false;
  }
}

/* ---- wiring ---- */
function renderAll(){ ensureCur(); renderPages(); renderStack(); renderPreview(); $('#siteName').value=S.name; if(!$('#t-design').hidden) renderDesign(); if(!$('#t-export').hidden) renderExport(); }
function tab(t){ $$('.tabs button').forEach(function(b){ b.classList.toggle('on',b.getAttribute('data-t')===t); }); ['build','design','export'].forEach(function(x){ $('#t-'+x).hidden=x!==t; }); if(t==='design') renderDesign(); if(t==='export') renderExport(); }
function init(){
  pv=$('#pv');
  pv.addEventListener('load',function(){ pvReady=true; var d=pv.contentDocument; if(!d) return; d.addEventListener('click',onPvClick,true); d.addEventListener('submit',function(e){e.preventDefault();},true); markSel(); });
  $$('.tabs button').forEach(function(b){ b.onclick=function(){ tab(b.getAttribute('data-t')); }; });
  $$('#viewSeg button').forEach(function(b){ b.onclick=function(){ view=b.getAttribute('data-v'); $$('#viewSeg button').forEach(function(x){x.classList.toggle('on',x===b);}); fit(); }; });
  $('#pageSel').onchange=function(e){ goPage(e.target.value); };
  $('#siteName').oninput=function(e){ var v=e.target.value; mutate(function(){ S.name=v||'サイト'; },'name',true); };
  $('#undo').onclick=undo; $('#addBlock').onclick=openLibrary; $('#addPage').onclick=openAddPage; $('#pageSet').onclick=openPageSheet;
  $('#shClose').onclick=closeSheet; $('#sheetBg').addEventListener('click',function(e){ if(e.target.id==='sheetBg') closeSheet(); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeSheet(); });
  $('#sGo').onclick=startAI; $('#sDemo').onclick=function(){ adopt(demoSite()); }; $('#sBlank').onclick=function(){ adopt(blankSite($('#sName').value.trim())); };
  $('#sCancel').onclick=hideStart; $('#progStop').onclick=function(){ if(buildCtl) buildCtl.abort(); };
  $('#progBack').onclick=function(){ $('#progBack').hidden=true; $('#progMsg').textContent=''; showStart(!!S); };
  if(window.ResizeObserver) new ResizeObserver(fit).observe($('#frameWrap')); else window.addEventListener('resize',fit);
  var saved=null; try{ saved=localStorage.getItem(KEY); }catch(e){}
  if(saved){ try{ S=cleanSite(JSON.parse(saved)); }catch(e){ S=null; } }
  if(S){ curPid=S.pages[0].id; renderAll(); } else { S=demoSite(); curPid=S.pages[0].id; renderAll(); S=null; showStart(false); }
  fit();
  if(window.claude && claude.use){
    claude.use('sample').then(function(s){ SAMPLE=s||null; if(!$('#start').hidden) showStart(!$('#sCancel').hidden); }).catch(function(){});
    claude.use('downloads').then(function(d){ DL=d||null; }).catch(function(){});
  }
}
document.addEventListener('DOMContentLoaded',init);

</script>
